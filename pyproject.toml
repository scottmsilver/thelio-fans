[project]
name = "fanwatch"
version = "0.2.0"
description = "Read-only fan, temperature and Io-board dashboard for a System76 Thelio Mira"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
fanwatch = "fanwatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "N", "PTH", "C4", "RET"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pynvml"
ignore_missing_imports = true
